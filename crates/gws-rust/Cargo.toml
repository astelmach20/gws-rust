[package]
name = "gws-rust"
version.workspace = true
edition.workspace = true
description = "Google Workspace CLI — dynamic command surface from Discovery Service"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
rust-version.workspace = true
keywords = ["cli", "google-workspace", "google", "drive", "gmail"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "gwsr"
path = "src/main.rs"

[dependencies]
gws-rust-core = { version = "0.22.5", path = "../gws-rust-core" }
aes-gcm = { version = "0.11", features = ["getrandom", "zeroize"] }
anyhow.workspace = true
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1"
chrono = "0.4.45"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "string"] }
crossterm = "0.29.0"
derive_builder = "0.20.2"
dirs = "7"
futures-util = "0.3"
iana-time-zone = "0.1"
mail-builder = "1.0"
mime_guess2 = "2.3.1"
percent-encoding.workspace = true
rand = "0.10"
ratatui = "0.30.2"
reqwest = { workspace = true, features = ["stream", "socks"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1"
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "v5"] }
yup-oauth2 = "12"
keyring = "4.2.0"
zeroize = { version = "1.9.0", features = ["derive"] }
csv = { version = "1.4.0", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
serial_test.workspace = true
wiremock = "0.6.5"

[lints]
workspace = true
