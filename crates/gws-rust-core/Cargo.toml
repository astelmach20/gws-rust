[package]
name = "gws-rust-core"
version.workspace = true
edition.workspace = true
description = "Google Workspace API client — Discovery Document types, service registry, and HTTP utilities"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
rust-version.workspace = true
keywords = ["google-workspace", "google", "discovery", "api-client"]
categories = ["api-bindings", "web-programming"]

[dependencies]
anyhow = { workspace = true, optional = true }
bytes = "1"
http = "1"
httpdate = "1"
percent-encoding.workspace = true
rand = "0.10"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim = "0.11.1"
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2.5.8"

[dev-dependencies]
proptest = "1.11.0"
serial_test.workspace = true
wiremock = "0.6.5"

[features]
# Enables `From<anyhow::Error> for GwsError` for binaries that use anyhow.
anyhow = ["dep:anyhow"]

[lints]
workspace = true
