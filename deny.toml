# cargo-deny configuration (schema of cargo-deny 0.20).
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# Run locally with `just deny`; CI runs it on every PR and on a daily schedule.

[graph]
# Every target we ship a binary for (see .github/workflows/release.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[output]
feature-depth = 1

# Known vulnerabilities, unmaintained and unsound crates, and yanked versions.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Any advisory not listed here fails the check. Every entry MUST carry a `reason`
# and a link to the tracking issue; remove it as soon as a fixed version is available.
ignore = []
unmaintained = "all"
unsound = "all"
yanked = "deny"

# License allowlist. Keep this minimal: an entry that no crate uses is reported
# (`unused-allowed-license = "warn"`) so the list does not silently grow stale.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "warn"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are fine; they are always published with a version.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # The CLI builds its command surface from Discovery documents at runtime.
    # Generated per-API client crates defeat that design (see AGENTS.md).
    { crate = "google-apis-common", reason = "use the runtime Discovery client in gws-rust-core" },
    # One TLS stack: rustls. Native OpenSSL complicates static musl builds and cross-compilation.
    { crate = "openssl-sys", reason = "use rustls; OpenSSL breaks static musl release builds" },
    { crate = "native-tls", reason = "use rustls; OpenSSL breaks static musl release builds" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
