name: Release

# Runs only for a vX.Y.Z[-pre] tag: either a tag push, or a workflow_dispatch whose ref is the tag
# (release-changesets.yml dispatches it, because tags pushed with GITHUB_TOKEN trigger nothing).
#
# Flow: plan -> build (reusable, read-only) -> package (archives, SBOM, SHA256SUMS, cosign
# signature, SLSA provenance + SBOM attestations) -> GitHub release -> crates.io, npm, Homebrew.
# Every job that publishes runs in the protected `release` environment and authenticates with
# short-lived OIDC credentials (crates.io and npm trusted publishing); no registry tokens exist.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm-tag: ${{ steps.meta.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != tag ]]; then
            echo "::error::Releases run only for tags; got a ${REF_TYPE} ref (${TAG}). Dispatch this workflow on a vX.Y.Z tag."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag ${TAG} is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          cargo_version="$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml)"
          npm_version="$(node -p "require('./npm/package.json').version")"
          root_version="$(node -p "require('./package.json').version")"
          for pair in "Cargo.toml:${cargo_version}" "npm/package.json:${npm_version}" "package.json:${root_version}"; do
            if [[ "${pair#*:}" != "$version" ]]; then
              echo "::error file=${pair%%:*}::version ${pair#*:} does not match tag ${TAG}"
              exit 1
            fi
          done
          if [[ "$version" == *-* ]]; then
            prerelease=true; npm_tag=next
          else
            prerelease=false; npm_tag=latest
          fi
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "npm-tag=${npm_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (prerelease=${prerelease}, npm dist-tag ${npm_tag})"

  build:
    name: Build
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml

  package:
    name: Package, sign and attest
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless cosign signing and attestation signing (Sigstore)
      attestations: write # store build-provenance and SBOM attestations
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: bins
      - name: Create archives
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(bins/bin-*)
          if [[ ${#dirs[@]} -ne 7 ]]; then
            echo "::error::expected 7 target binaries, found ${#dirs[@]}: ${dirs[*]}"
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            target="${dir#bins/bin-}"
            case "$target" in
              *windows*) bin="${dir}/gwsr.exe" ;;
              *) bin="${dir}/gwsr" ;;
            esac
            scripts/package-release.sh "$VERSION" "$target" "$bin" dist
          done

      - uses: ./.github/actions/setup-rust
        with:
          components: ""
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path crates/gws-rust/Cargo.toml --all-features --target all \
            --format json --spec-version 1.5 --override-filename "gws-rust-${VERSION}.cdx"
          # cargo-cyclonedx omits serialNumber when SOURCE_DATE_EPOCH is set (a random UUID would
          # break reproducibility), but actions/attest rejects a CycloneDX SBOM without one. Derive
          # a stable UUIDv5 from the release so the SBOM stays reproducible.
          serial="urn:uuid:$(python3 -c 'import sys, uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, sys.argv[1]))' \
            "https://github.com/${GITHUB_REPOSITORY}/releases/v${VERSION}")"
          jq --arg serial "$serial" '.serialNumber = $serial' "crates/gws-rust/gws-rust-${VERSION}.cdx.json" \
            > "dist/gws-rust-${VERSION}.cdx.json"
          rm "crates/gws-rust/gws-rust-${VERSION}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.serialNumber | startswith("urn:uuid:")) and (.components | length) > 0' \
            "dist/gws-rust-${VERSION}.cdx.json" >/dev/null

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.cdx.json' \) -printf '%f\n' \
            | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign checksums (keyless)
        working-directory: dist
        run: cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --yes

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/gws-rust-${{ needs.plan.outputs.version }}.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [plan, package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the GitHub release and upload assets
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "gws-rust ${TAG}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${flags[@]}"

  publish-crates:
    name: Publish to crates.io
    needs: [plan, github-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # `cargo publish --workspace` publishes in dependency order and waits for each crate to
          # be indexed. Crates already at this version (a re-run) are excluded explicitly.
          exclude=()
          for crate in gws-rust-core gws-rust; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user-agent "gws-rust-release (https://github.com/astelmach20/gws-rust)" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            case "$status" in
              200) echo "::notice::${crate}@${VERSION} is already on crates.io; skipping."; exclude+=(--exclude "$crate") ;;
              404) ;;
              *) echo "::error::crates.io returned HTTP ${status} for ${crate}@${VERSION}"; exit 1 ;;
            esac
          done
          if [[ ${#exclude[@]} -eq 4 ]]; then
            echo "All crates already published."
            exit 0
          fi
          cargo publish --workspace --locked "${exclude[@]}"

  publish-npm:
    name: Publish to npm
    needs: [plan, github-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Build platform packages from the signed release archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node npm/scripts/build-packages.mjs --version "$VERSION" --artifacts dist --out "$RUNNER_TEMP/npm-packages"
      - name: Publish
        env:
          NPM_TAG: ${{ needs.plan.outputs.npm-tag }}
        run: scripts/npm-publish.sh "$RUNNER_TEMP/npm-packages" "$NPM_TAG"

  homebrew:
    name: Update Homebrew tap
    needs: [plan, github-release]
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check tap credentials
        id: creds
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning title=Homebrew tap not updated::HOMEBREW_TAP_TOKEN is not set in the release environment, so astelmach20/homebrew-tap was NOT updated for v${VERSION}. Add a fine-grained token with contents:write on that repository and re-run this job."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          name: dist
          path: dist
      - name: Render formula
        if: steps.creds.outputs.configured == 'true'
        run: scripts/homebrew-formula.sh "$VERSION" dist/SHA256SUMS > "$RUNNER_TEMP/gws-rust.rb"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          repository: astelmach20/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: true # zizmor: ignore[artipacked] needed to push; nothing is uploaded from this job
      - name: Commit and push formula
        if: steps.creds.outputs.configured == 'true'
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp "$RUNNER_TEMP/gws-rust.rb" Formula/gws-rust.rb
          if git diff --quiet -- Formula/gws-rust.rb && git ls-files --error-unmatch Formula/gws-rust.rb >/dev/null 2>&1; then
            echo "Formula already at ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gws-rust.rb
          git commit -m "gws-rust ${VERSION}"
          git push origin HEAD
