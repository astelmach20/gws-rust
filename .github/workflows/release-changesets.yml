name: Release (Changeset)

# On every push to main: if changesets are pending, open/update the "chore: release versions" PR
# (version bumps via scripts/version-sync.sh). When that PR merges, tag vX.Y.Z via
# scripts/tag-release.sh, which also dispatches release.yml because tags pushed with
# GITHUB_TOKEN do not trigger workflows on their own.
#
# PRs opened with GITHUB_TOKEN do not trigger CI. Configure a GitHub App (repository variable
# BOT_APP_ID + secret BOT_APP_PRIVATE_KEY, with contents and pull-requests write) to get checks
# on the release PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Version PR or tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the release branch and the vX.Y.Z tag
      pull-requests: write # open or update the release PR
      actions: write # dispatch release.yml on the new tag
    steps:
      - id: app-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: vars.BOT_APP_ID == ''
        run: echo "::warning::BOT_APP_ID is not configured; the release PR is opened with GITHUB_TOKEN and CI will not run on it until it is closed and reopened."

      # Credentials are needed: changesets/action pushes the release branch and tag-release.sh
      # pushes the tag with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true # zizmor: ignore[artipacked] no artifacts are uploaded from this job
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          version-script: pnpm run version-sync
          publish-script: pnpm run tag-release
          commit-message: "chore: release versions"
          pr-title: "chore: release versions"
          create-github-releases: false
          push-git-tags: false
        env:
          GH_TOKEN: ${{ github.token }}
          # With an App token the tag push itself triggers release.yml; only dispatch without one.
          GWSR_DISPATCH_RELEASE: ${{ steps.app-token.outputs.token == '' && '1' || '0' }}
