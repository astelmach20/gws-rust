name: Publish skills to ClawHub

# Opt-in: set the repository variable CLAWHUB_PUBLISH=true and add the CLAWHUB_TOKEN secret to
# the `clawhub` environment. Publishing never runs on pull requests.
on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - .github/workflows/publish-skills.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: vars.CLAWHUB_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: clawhub
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Exact version, no install scripts; a lockfile for one global CLI adds nothing here.
      - run: npm install --global --ignore-scripts clawhub@0.23.3 # zizmor: ignore[adhoc-packages]
      - name: Authenticate
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [[ -z "$CLAWHUB_TOKEN" ]]; then
            echo "::error::CLAWHUB_PUBLISH=true but the CLAWHUB_TOKEN secret is not set in the clawhub environment."
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
      - run: >-
          clawhub sync --root skills --all
          --source-repo "${GITHUB_REPOSITORY}"
          --source-commit "${GITHUB_SHA}"
          --source-ref "${GITHUB_REF}"
