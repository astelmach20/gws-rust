name: Nix

on:
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, Cargo.toml, Cargo.lock, "crates/**", rust-toolchain.toml, .github/workflows/nix.yml]
  pull_request:
    paths: [flake.nix, flake.lock, Cargo.toml, Cargo.lock, "crates/**", rust-toolchain.toml, .github/workflows/nix.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake:
    name: nix flake check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Builds the package with doCheck = true (runs the test suite) and evaluates every output.
      - run: nix flake check --print-build-logs
      - run: nix develop --command bash -c 'cargo --version && cargo deny --version && just --version && pnpm --version && uv --version'
