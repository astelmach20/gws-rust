name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Includes unit, integration and doc tests. (--all-targets would skip doc tests.)
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml)"
          if [[ -z "$msrv" ]]; then
            echo "::error file=Cargo.toml::[workspace.package] rust-version is missing"
            exit 1
          fi
          echo "version=${msrv}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --all-features --locked

  beta:
    name: Beta toolchain (allowed to fail)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Early warning for upcoming compiler/clippy changes. Never blocks a merge, but a failure is
    # reported as a warning annotation and in the job summary.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: beta
          components: clippy
      - id: beta
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          clippy=$?
          cargo test --workspace --all-features --locked
          test=$?
          {
            echo "## Beta toolchain"
            echo "- clippy: exit ${clippy}"
            echo "- test: exit ${test}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $clippy -ne 0 || $test -ne 0 ]]; then
            echo "::warning title=Beta toolchain::clippy exit ${clippy}, test exit ${test}. Fix before the next stable release."
            exit 1
          fi

  docs:
    name: Rustdoc
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --all-features --no-deps --locked

  machete:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@0.9.1
      # Fails if line coverage drops below the floor in scripts/coverage.sh.
      - run: scripts/coverage.sh --lcov
      - name: Coverage summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          retention-days: 14
          if-no-files-found: error

  skills:
    name: Skills
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Validate skills
        run: |
          failed=0
          for skill_dir in skills/*/; do
            if ! uvx --from 'skills-ref==0.1.1' agentskills validate "$skill_dir"; then
              echo "::error file=${skill_dir}SKILL.md::skill failed validation"
              failed=1
            fi
          done
          exit "$failed"
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Generated skills also change when Google updates a Discovery document, which a PR cannot
      # control, so drift is a warning here; the scheduled Generate Skills workflow opens a PR.
      - name: Check generated skills are current
        run: |
          cargo run --locked -- dev generate-skills --output-dir skills --index docs/skills.md
          # `git status` also sees new (untracked) skills and pruned ones; `git diff` alone misses
          # new files.
          if [ -n "$(git status --porcelain -- skills/ docs/skills.md)" ]; then
            git status --short -- skills/ docs/skills.md
            echo "::warning title=Skills drift::Generated skills differ from the committed ones. Run 'just skills' and commit the result if your change caused this."
          fi
          # Every skill directory must be generator-owned; anything else is a leftover the
          # generator cannot prune (hand-written, or from before skills carried the marker).
          leftovers=""
          for dir in skills/*/; do
            if ! grep -qxF '<!-- gwsr generated skill: do not edit by hand -->' "${dir}SKILL.md" 2>/dev/null; then
              leftovers="$leftovers ${dir%/}"
            fi
          done
          if [ -n "$leftovers" ]; then
            echo "::warning title=Skills leftovers::Not produced by the generator:$leftovers. Delete them if they are stale."
          fi

  js:
    name: npm shim and release scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: shellcheck --severity=style scripts/*.sh
      - run: node --test "npm/test/*.test.mjs" "scripts/test/*.test.mjs"
      - name: Check the npm package contents
        working-directory: npm
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          # shellcheck disable=SC2016 # the single-quoted program is JavaScript
          node -e '
            const [pack] = require(process.argv[1]);
            const files = pack.files.map((f) => f.path).sort();
            for (const required of ["bin/gwsr.js", "lib/platform.js", "platforms.json", "package.json"]) {
              if (!files.includes(required)) throw new Error(`npm package is missing ${required}: ${files}`);
            }
            if (files.some((f) => f.startsWith("test/") || f.startsWith("scripts/"))) {
              throw new Error(`npm package must not ship tests or scripts: ${files}`);
            }
            console.log(files.join("\n"));
          ' "$RUNNER_TEMP/pack.json"

  policy:
    name: PR policy
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-changeset.sh "origin/${BASE_REF}"

  # Single required check for branch protection: it passes only when every gating job passed.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, msrv, docs, machete, coverage, skills, js, policy]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . != "success" and . != "skipped")' <<<"$RESULTS" >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
