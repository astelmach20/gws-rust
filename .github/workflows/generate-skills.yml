name: Generate Skills

# Regenerates skills from the live Discovery documents and opens (or updates) a PR when Google's
# API surface changed. PRs opened with the default GITHUB_TOKEN do not trigger CI; configure a
# GitHub App (repository variable BOT_APP_ID + secret BOT_APP_PRIVATE_KEY, with contents and
# pull-requests write) so the sync PR gets checks.
on:
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    name: Regenerate skills
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the chore/sync-skills branch (when no GitHub App is configured)
      pull-requests: write # open or update the sync PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo run --locked -- dev generate-skills --output-dir skills --index docs/skills.md

      - id: diff
        run: |
          if git diff --quiet -- skills/ docs/skills.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Skills are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- skills/ docs/skills.md
          fi

      - name: Add changeset
        if: steps.diff.outputs.changed == 'true'
        run: |
          cat > .changeset/sync-skills.md <<'CHANGESET'
          ---
          "gws-rust": patch
          ---

          Sync generated skills with the latest Google Discovery documents
          CHANGESET

      - id: app-token
        if: steps.diff.outputs.changed == 'true' && vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Warn when CI will not run on the PR
        if: steps.diff.outputs.changed == 'true' && vars.BOT_APP_ID == ''
        run: echo "::warning::BOT_APP_ID is not configured; the sync PR is opened with GITHUB_TOKEN and CI will not run on it until it is closed and reopened."

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.diff.outputs.changed == 'true'
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: chore/sync-skills
          title: "chore: sync skills with Discovery API"
          body: |
            Automated PR: the Google Discovery documents changed and the generated skills are out of date.

            Created by the Generate Skills workflow (`.github/workflows/generate-skills.yml`).
          commit-message: "chore: regenerate skills from Discovery API"
          add-paths: |
            skills/
            docs/skills.md
            .changeset/sync-skills.md
          delete-branch: true
